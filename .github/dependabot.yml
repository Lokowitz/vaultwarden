version: 2
updates:
  - package-ecosystem: "npm" 
    directory: "/playwright" 
    schedule:
      interval: "daily"
    groups:
      npm-dependencies:
        patterns:
          - "*"
  
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "daily"
    groups:
      docker-dependencies:
        patterns:
          - "*"
          
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
